name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  test:
    name: 测试
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20.x]

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: 安装依赖
      run: npm ci

    - name: 运行 Lint
      run: npm run lint --if-present

    - name: 运行单元测试
      run: npm run test:unit --if-present

    - name: 构建应用
      run: npm run build

  build:
    name: 构建安装包
    needs: test
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: 安装依赖
      run: npm ci

    - name: 准备平台资源 (macOS)
      if: matrix.platform == 'mac'
      run: npm run prepare:mac-arm64

    - name: 准备平台资源 (Windows)
      if: matrix.platform == 'win'
      run: npm run prepare:win-x64

    - name: 准备平台资源 (Linux)
      if: matrix.platform == 'linux'
      run: npm run prepare:linux-x64

    - name: 构建安装包
      run: npm run build:${{ matrix.platform }}

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: project4-${{ matrix.platform }}
        path: |
          dist/*.dmg
          dist/*.exe
          dist/*.AppImage
          dist/*.zip
        retention-days: 7
